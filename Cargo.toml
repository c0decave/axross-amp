[package]
name = "axross-amp"
version = "0.15.1"
description = "axross's Media Player as a program of its own, in Rust: playlists, a ten-band equalizer, visualizations, internet radio"
license = "Apache-2.0"
repository = "https://github.com/c0decave/axross-amp"
keywords = ["audio", "music", "player", "visualizer", "equalizer"]
categories = ["multimedia::audio"]
readme = "README.md"
edition = "2024"

[dependencies]
cpal = { version = "0.18.2", features = ["pulseaudio"] }
crossbeam-channel = "0.5.17"
dirs = "7.0.0"
eframe = "0.37.0"
egui = "0.37"
egui-file-dialog = "0.16.0"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
# (already in the lock through rustls: the update's Ed25519 signature and
# SHA-256 - src/update.rs)
ring = "0.17.14"
rustfft = "6.4.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
symphonia = { version = "0.6.1", features = ["all"] }
symphonia-adapter-libopus = "0.3.0"
ureq = { version = "3.5.1", default-features = false, features = ["rustls"] }

[dev-dependencies]
egui_kittest = { version = "0.37.0", features = ["wgpu", "snapshot", "eframe"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[target.'cfg(unix)'.dependencies]
# (already in the lock through the sound and window crates: setsid and fcntl
# for going to the background)
libc = "0.2.191"

[target.'cfg(windows)'.dependencies]
# (already in the lock through the window and sound crates: AttachConsole,
# for --help and messages from a GUI program started in a terminal)
windows-sys = { version = "0.61.2", features = ["Win32_System_Console"] }

[target.'cfg(target_os = "linux")'.dependencies]
# BlueZ over D-Bus (the Bluetooth tab); already in the tree through accesskit
zbus = "5.19"

# (the tests render every face through seconds of music, frame by frame:
# optimised a little they take minutes, not half an hour; debug assertions
# stay on)
[profile.test]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
